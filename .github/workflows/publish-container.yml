name: publish-container
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The image is published only after every gate passes.
      - run: dotnet restore RoutePacer.slnx
      - run: dotnet build RoutePacer.slnx -c Release --no-restore
      # Microsoft.Playwright.Xunit only drops playwright.ps1 into the build output; it never
      # downloads a browser. Without this the whole E2E project fails at LaunchAsync and no image
      # is ever published.
      - run: pwsh tests/RoutePacer.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test RoutePacer.slnx -c Release --no-build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/jamiemitchellconsultants/routepacer:latest
            ghcr.io/jamiemitchellconsultants/routepacer:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/jamiemitchellconsultants/routepacer:{0}', github.ref_name) || '' }}
