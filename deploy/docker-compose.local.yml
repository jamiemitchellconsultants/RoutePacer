# Local-only stack: builds the image from this checkout and publishes it on the loopback address.
services:
  routepacer:
    build: ..
    ports: ["127.0.0.1:${ROUTEPACER_PORT:-49216}:8080"]
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
    healthcheck:
      test: [CMD, dotnet, RoutePacer.Server.dll, --healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
