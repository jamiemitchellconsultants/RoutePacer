services:
  routepacer-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: routepacer, POSTGRES_USER: routepacer, POSTGRES_PASSWORD: local-only }
    networks: [routepacer-private]
  routepacer:
    build: ..
    ports: ["127.0.0.1:49216:8080"]
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__RoutePacer: Host=routepacer-db;Database=routepacer;Username=routepacer;Password=local-only
      HandoffRelay__PublicOrigin: https://pacetracking.tqaentry.com
    depends_on: [routepacer-db]
    networks: [routepacer-private]
networks:
  routepacer-private:
    internal: true
