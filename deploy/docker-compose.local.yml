# Local-only stack. Credentials here are deliberately non-secret and must never be reused.
services:
  routepacer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routepacer
      POSTGRES_USER: routepacer
      POSTGRES_PASSWORD: local-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U routepacer"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [routepacer-private]
  routepacer:
    build: ..
    ports: ["127.0.0.1:${ROUTEPACER_PORT:-49216}:8080"]
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrations: "true"
      ConnectionStrings__RoutePacer: Host=routepacer-db;Database=routepacer;Username=routepacer;Password=local-only
      HandoffRelay__PublicOrigin: https://pacetracking.tqaentry.com
      HandoffRelay__UploadsEnabled: "false"
      RouteTimerInvocation__Enabled: "false"
    healthcheck:
      test: [CMD, dotnet, RoutePacer.Server.dll, --healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      routepacer-db:
        condition: service_healthy
    networks: [routepacer-private]
networks:
  routepacer-private:
    internal: true
