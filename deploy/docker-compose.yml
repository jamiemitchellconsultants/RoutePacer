# RoutePacer serves an offline-first PWA and nothing else. It holds no state, reaches no
# dependency, and takes no secret -- so there is no database, no credential and no env file to
# provision. Deploy an immutable ROUTEPACER_IMAGE_TAG and publish it through the shared ingress.
services:
  routepacer:
    image: ghcr.io/jamiemitchellconsultants/routepacer:${ROUTEPACER_IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: [CMD, dotnet, RoutePacer.Server.dll, --healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
    networks: [mcp-public]
networks:
  mcp-public:
    external: true
