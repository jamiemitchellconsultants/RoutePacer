<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoutePacer</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/tracker.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RoutePacer.App.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Bootstrap 5.3 themes from data-bs-theme rather than the media query, so the rider's system
      // choice is applied here and kept in step if they change it mid-ride. Inline and before the
      // body so the page never paints light first. The tracker is black regardless -- see tracker.css.
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function (on) { document.documentElement.setAttribute('data-bs-theme', on ? 'dark' : 'light'); };
        apply(dark.matches);
        dark.addEventListener('change', function (e) { apply(e.matches); });
      })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
